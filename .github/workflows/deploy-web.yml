name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, claude/serene-ptolemy-fv985j]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Build web app
        run: npm run web:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA rewrites; serving index.html as 404.html makes deep links work.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html && touch apps/web/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          force_orphan: true
