name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 has an arborist bug with this workspace layout; npm 11 resolves it.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run web:build
